<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슈퍼 관리자 페이지</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>슈퍼 관리자 페이지</h1>
        <nav>
            <ul>
                <li><a href="index.html">메인 페이지</a></li>
                <li><a href="admin.html">페이지 관리자</a></li>
            </ul>
        </nav>
    </header>

    <section class="page-creation">
        <h2 id="form-title">페이지 생성</h2>
        <div class="form-row">
            <label>페이지 이름</label>
            <input id="pageName" type="text" placeholder="페이지 이름" />
        </div>
        <div class="form-row">
            <label>슬러그 (고유 이름)</label>
            <input id="pageSlug" type="text" placeholder="슬러그 (고유 이름)" />
        </div>
        <div class="form-row">
            <label>페이지 설명</label>
            <input id="pageDescription" type="text" placeholder="페이지 설명" />
        </div>
        <div class="form-row">
            <label>사진 URL</label>
            <input id="pagePhoto" type="text" placeholder="사진 URL" />
        </div>
        <div class="form-row">
            <label>관리자 비밀번호</label>
            <input id="adminPassword" type="password" placeholder="새 관리자 비밀번호 (수정 시 비워두면 유지)" />
        </div>
        <div class="form-row">
            <label>플랜</label>
            <select id="plan">
                <option value="free">free</option>
                <option value="pro">pro</option>
            </select>
        </div>
        <div class="form-row">
            <label>링크 관리</label>
            <ul id="sa-link-list" class="link-list"></ul>
            <div class="inline-inputs">
                <input id="saLinkName" placeholder="새 링크 이름">
                <input id="saLinkUrl" placeholder="새 링크 URL">
                <button onclick="addSuperAdminLink()">링크 추가</button>
            </div>
        </div>
        <div class="form-actions">
            <button id="submit-btn" onclick="submitPage()">페이지 생성</button>
            <button id="cancel-edit-btn" style="display: none;" onclick="resetForm()">수정 취소</button>
        </div>
    </section>

    <section class="page-list">
        <h2>페이지 목록</h2>
        <ul id="pages">
            <!-- 동적으로 페이지 목록을 표시 -->
        </ul>
    </section>

    <footer>
        <p>&copy; 2025 인플루언서 페이지 관리 시스템</p>
    </footer>

    <script src="js/suscript.js"></script>
</body>
</html>
