<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 대시보드</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="/config.js"></script>
</head>
<body>
    <header>
        <h1>내 대시보드</h1>
        <span id="env-badge" class="env-badge" aria-live="polite" style="display: none;"></span>
    </header>

    <section class="status-banner" id="user-dashboard-status" style="display: none;"></section>

    <section class="card" id="user-dashboard-card">
        <div class="card-header">
            <div>
                <p class="eyebrow">페이지</p>
                <h3>내가 관리하는 페이지</h3>
                <p class="help-text">페이지를 선택해 관리자 화면으로 이동하세요.</p>
            </div>
            <div class="card-actions">
                <button class="ghost" type="button" onclick="refreshUserDashboard()">새로고침</button>
                <button class="secondary" type="button" onclick="userLogout()">로그아웃</button>
            </div>
        </div>
        <ul id="user-pages-list" class="link-list"></ul>
    </section>

    <footer>
        <p>&copy; 2025 인플루언서 페이지 관리 시스템</p>
    </footer>

    <script src="js/platforms.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
