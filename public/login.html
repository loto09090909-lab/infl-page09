<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-base" content="https://infl-worker.loto09090909.workers.dev">
    <title>슈퍼 관리자 로그인</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="/config.js"></script>
</head>
<body>
    <header>
        <h1>슈퍼 관리자 로그인</h1>
        <span id="env-badge" class="env-badge" aria-live="polite" style="display: none;"></span>
    </header>

    <section class="card api-card" id="api-debug"></section>

    <section class="status-banner" id="super-login-status" style="display: none;"></section>

    <section class="login-form">
        <input id="username" type="text" placeholder="아이디" value="admin">
        <input id="password" type="password" placeholder="비밀번호">
        <div class="login-actions">
            <button onclick="login()">로그인</button>
            <button class="ghost" onclick="bootstrapSuperAdmin()">최초 계정 생성/재설정</button>
            <button class="secondary" onclick="showD1SeedSql()">D1 시드 SQL 보기</button>
        </div>
        <p class="help-text">첫 계정은 누구나 생성할 수 있으며, 이후에는 기존 슈퍼 관리자 토큰으로만 추가/재설정할 수 있습니다.</p>
        <pre id="d1-seed-snippet" class="code-block" aria-live="polite"></pre>
    </section>

    <footer>
        <p>&copy; 2025 인플루언서 페이지 관리 시스템</p>
    </footer>

    <script src="js/platforms.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
