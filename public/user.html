<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-base" content="https://infl-worker.loto09090909.workers.dev">
    <title>{{PAGE_NAME}} 바로바로</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="/config.js"></script>
</head>
<body class="user-view theme-scope">
    <main class="user-shell">
        <section class="user-card">
            <header class="user-header">
                <h1>{{PAGE_NAME}} 바로바로</h1>
                <span id="env-badge" class="env-badge" aria-live="polite" style="display: none;"></span>
            </header>

            <div class="profile user-profile">
                <img src="{{PAGE_PHOTO_URL}}" alt="{{PAGE_NAME}}" class="profile-photo user-avatar">
                <p class="profile-description">{{PAGE_DESCRIPTION}}</p>
            </div>

            <section class="links user-links">
                <h3>링크</h3>
                <ul id="links-list" class="link-stack">
                    <!-- Links will be dynamically inserted here -->
                </ul>
            </section>

            <section class="share-panel" id="share-panel">
                <h3>공유하기</h3>
                <div class="share-actions">
                    <a id="share-kakao" href="#" target="_blank" rel="noopener">카카오 공유</a>
                    <a id="share-line" href="#" target="_blank" rel="noopener">라인 공유</a>
                    <a id="share-email" href="#">이메일 공유</a>
                </div>
                <div class="share-qr">
                    <img id="share-qr-image" alt="QR 코드" />
                    <div>
                        <p class="help-text">QR 코드를 스캔해 페이지를 열 수 있습니다.</p>
                        <a id="share-qr-download" class="ghost-link" href="#" download="page-qr.png">QR 다운로드</a>
                    </div>
                </div>
            </section>

            <footer class="user-footer">
                <p>&copy; 2025 인플루언서 페이지</p>
            </footer>
        </section>
    </main>

    <script src="js/platforms.js"></script>
    <script src="js/qrcode.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
