<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-base" content="https://infl-worker.loto09090909.workers.dev">
    <title>페이지 관리자 로그인</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>페이지 관리자 로그인</h1>
        <p>URL 경로에 포함된 인플루언서 식별자 기준으로 인증합니다. 예: <code>/침착맨/admin</code></p>
    </header>

    <section class="login-form">
        <input id="page-admin-id" type="text" placeholder="페이지 ID (URL에 없는 경우 입력)">
        <input id="page-admin-password" type="password" placeholder="페이지 관리자 비밀번호">
        <button onclick="pageAdminLogin()">로그인</button>
    </section>

    <script src="/js/script.js"></script>
</body>
</html>
