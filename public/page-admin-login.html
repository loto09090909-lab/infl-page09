<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지 관리자 로그인</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/config.js"></script>
</head>
<body>
    <header>
        <h1>페이지 관리자 로그인</h1>
        <p></code></p>
        <span id="env-badge" class="env-badge" aria-live="polite" style="display: none;"></span>
    </header>

    <section class="status-banner" id="page-login-status" style="display: none;"></section>

    <section class="login-form">
        <input id="page-admin-id" type="text" placeholder="페이지 ID 또는 슬러그">
        <input id="page-admin-email" type="email" placeholder="관리자 이메일">
        <input id="page-admin-password" type="password" placeholder="비밀번호">
        <button onclick="pageAdminLogin()">로그인</button>
    </section>

    <script src="/js/platforms.js"></script>
    <script src="js/script.js?v=9"></script>
</body>
</html>
