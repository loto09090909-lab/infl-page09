<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-base" content="https://infl-worker.loto09090909.workers.dev">
    <title>{{PAGE_NAME}} 관리자</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page-role="page-admin" class="page-admin">
    <header class="page-hero">
        <div>
            <p class="eyebrow">페이지 관리자</p>
            <h1>내 페이지 링크를 직접 관리하세요</h1>
            <p class="subtitle">링크 순서를 조정하고, 아이콘을 붙여 깔끔한 프로필을 만들 수 있습니다.</p>
            <div class="page-context">
                <span class="badge">현재 페이지: <strong id="current-page-id">-</strong></span>
                <a id="public-link" class="ghost-link" href="#" target="_blank" rel="noopener">공개 페이지 열기</a>
            </div>
        </div>
        <div class="hero-cta">
            <button class="secondary" onclick="logout()">로그아웃</button>
        </div>
    </header>

    <main class="layout">
        <section class="card profile-edit">
            <div class="card-header">
                <div>
                    <p class="eyebrow">프로필</p>
                    <h3>페이지 정보 수정</h3>
                    <p class="help-text">이름과 설명, 프로필 이미지를 업데이트하면 공개 페이지에도 바로 반영됩니다.</p>
                </div>
                <button class="primary" onclick="savePage()">저장</button>
            </div>
            <div class="form-grid">
                <input id="name" placeholder="페이지 이름" value="{{PAGE_NAME}}">
                <input id="desc" placeholder="페이지 설명" value="{{PAGE_DESCRIPTION}}">
                <input id="photo" placeholder="프로필 사진 URL" value="{{PAGE_PHOTO_URL}}">
            </div>
        </section>

        <section class="card link-management">
            <div class="card-header">
                <div>
                    <p class="eyebrow">링크</p>
                    <h3>링크 관리</h3>
                    <p class="help-text">▲▼ 버튼으로 순서를 조정하고, 필요하면 아이콘 URL을 넣어보세요. 입력한 순서대로 사용자 페이지에 노출됩니다.</p>
                </div>
                <div class="inline-inputs">
                    <input id="newLinkName" placeholder="새 링크 이름">
                    <input id="newLinkUrl" placeholder="새 링크 URL">
                    <input id="newLinkIcon" placeholder="아이콘 이미지 URL (선택)">
                    <button class="primary" onclick="addLink()">링크 추가</button>
                </div>
            </div>
            <ul id="link-list" class="link-list">
                <!-- Links will be dynamically inserted here -->
            </ul>
        </section>

        <section class="card preview-card">
            <div class="card-header">
                <div>
                    <p class="eyebrow">미리보기</p>
                    <h3>사용자에게 보이는 모습</h3>
                </div>
            </div>
            <div class="preview">
                <div class="profile">
                    <img class="profile-photo" alt="프로필 사진">
                    <p class="profile-description"></p>
                </div>
                <div class="links">
                    <h3>링크</h3>
                    <ul id="links-list"></ul>
                </div>
            </div>
        </section>
    </main>

    <script src="js/platforms.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
