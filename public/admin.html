<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-base" content="https://infl-worker.loto09090909.workers.dev">
    <title>{{PAGE_NAME}} 관리자</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page-role="page-admin">
    <header>
        <h1>{{PAGE_NAME}} 관리자 페이지</h1>
    </header>

    <section class="profile-edit">
        <h3>페이지 정보 수정</h3>
        <input id="name" placeholder="페이지 이름" value="{{PAGE_NAME}}">
        <input id="desc" placeholder="페이지 설명" value="{{PAGE_DESCRIPTION}}">
        <input id="photo" placeholder="프로필 사진 URL" value="{{PAGE_PHOTO_URL}}">
        <button onclick="savePage()">저장</button>
        <button onclick="logout()">로그아웃</button>
    </section>

    <section class="link-management">
        <h3>링크 관리</h3>
        <ul id="link-list">
            <!-- Links will be dynamically inserted here -->
        </ul>
        <input id="newLinkName" placeholder="새 링크 이름">
        <input id="newLinkUrl" placeholder="새 링크 URL">
        <input id="newLinkIcon" placeholder="아이콘 이미지 URL (선택)">
        <button onclick="addLink()">링크 추가</button>
    </section>

    <section class="ads-management">
        <h3>광고 설정</h3>
        <input type="checkbox" id="ads"> 광고 표시
        <button onclick="saveAdsSettings()">저장</button>
    </section>

    <script src="js/platforms.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
