name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**' # worker 폴더의 변경 사항이 있을 때만 실행

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # 💡 [핵심 수정 1]: 모든 후속 단계의 작업 디렉토리를 'worker'로 설정
    defaults:
      run:
        working-directory: './worker' 

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16'

    # 이제 이 npm install은 ./worker/package.json을 찾아 실행됩니다.
    - name: Install dependencies (in /worker)
      run: npm install 
      
    # Wrangler는 보통 전역(global)으로 설치하지 않고 로컬 의존성으로 설치하거나 npx를 사용합니다.
    # 여기서는 설치 방식의 비효율성을 개선했습니다.
    # -> (이 단계는 생략해도 됩니다. 아래 publish 단계에서 npx를 사용합니다.)

    # 💡 [핵심 수정 2]: wrangler publish 대신 npx wrangler deploy 사용
    - name: Publish to Cloudflare Workers
      # Wrangler를 전역 설치하는 대신, npx를 사용하여 로컬 또는 임시 설치된 버전을 사용합니다.
      # 또한, publish 대신 deploy를 사용하는 것이 최신 Wrangler 관례입니다.
      # 환경변수 `--env production`을 사용하려면 wrangler.toml에 [env.production] 섹션이 정의되어 있어야 합니다.
      # env: production이 없다면, 이 플래그를 제거해야 합니다.
      run: npx wrangler deploy --env production
      env:
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }} 
        # API 토큰 변수 이름은 CLOUDFLARE_API_TOKEN으로 통일하는 것이 권장되지만,
        # 사용자 정의 변수 이름(CF_API_TOKEN)도 Wrangler 액션이 처리할 수 있습니다.
