name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**' # worker 폴더의 변경 사항이 있을 때만 실행

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # defaults.run.working-directory가 제대로 작동하지 않는 경우를 대비하여 각 step에 명시합니다.

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16'

    # 1. 의존성 설치 단계를 /worker 폴더에서 실행
    - name: Install dependencies (in /worker)
      run: npm install 
      working-directory: './worker' # 👈 **[핵심 수정]**

    - name: Start Wrangler Dev Server
      run: npx wrangler dev &
      working-directory: './worker'

    - name: Wait for server to start
      run: sleep 10

    - name: Run E2E Test
      run: |
        chmod +x ../scripts/admin_e2e.sh
        ../scripts/admin_e2e.sh
      working-directory: './worker'
      env:
        BASE_URL: http://127.0.0.1:8787
        TOKEN_SECRET: "test-secret"
        SESSION_SECRET: "test-secret"

    # 2. 배포 명령 단계를 /worker 폴더에서 실행
    - name: Publish to Cloudflare Workers
      # /worker 디렉토리에서 npx wrangler deploy를 실행합니다.
      run: npx wrangler deploy --env production
      working-directory: './worker' # 👈 **[핵심 수정]**
      env:
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

